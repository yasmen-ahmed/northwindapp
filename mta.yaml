_schema-version: 3.3.0
ID: northwindapp
version: 1.0.0
modules:
- name: northwindapp-approuter
  type: approuter.nodejs
  path: approuter
  parameters:
    memory: 256M
    disk-quota: 512M
  requires:
  - name: northwindapp-uaa
  - name: northwindapp-destination-service
    group: destinations
    properties:
      forwardAuthToken: true
      name: ui5
      url: https://ui5.sap.com
  build-parameters:
    builder: custom
    commands:
    - npm install
    requires:
    - name: northwindapp-ui
      artifacts:
      - '*'
      target-path: resources
- name: northwindapp-ui
  type: html5
  path: .
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: northwindapp-uaa
  type: org.cloudfoundry.managed-service
  parameters:
    service: xsuaa
    service-plan: application
    path: ./xs-security.json
- name: northwindapp-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: northwindapp-destination-service
    service-plan: lite
parameters:
  enable-parallel-deployments: true
