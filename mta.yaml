_schema-version: 3.3.0
ID: northwindapp
version: 1.0.0
modules:
- name: northwindapp-approuter
  type: approuter.nodejs
  path: approuter
  requires:
  - name: northwindapp_html_repo_runtime
  - name: northwindapp-destination-service
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com
- name: northwindapp-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: northwindapp-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - cominternnorthwindappnorthwindapp.zip
      name: cominternnorthwindappnorthwindapp
      target-path: resources/
- name: cominternnorthwindappnorthwindapp
  type: html5
  path: .
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: northwindapp_html_repo_runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: northwindapp-html5-rt
    service-plan: app-runtime
- name: northwindapp-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: northwindapp-html5-service
    service-plan: app-host
- name: northwindapp-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: northwindapp-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
